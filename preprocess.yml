name: Preprocess Dataset

on:
  push:
    branches: [main]
    paths:
      - "codecomplex_raw/**"
      - "preprocessing/automate_BryanNoel.py"
      - "preprocessing/requirements.txt"
      - ".github/workflows/preprocess.yml"
  workflow_dispatch:   # bisa dijalankan manual dari tab Actions

permissions:
  contents: write      # diperlukan agar workflow dapat meng-commit dataset hasil preprocessing

jobs:
  preprocess:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repositori
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: preprocessing/requirements.txt

      - name: Instal dependensi
        run: pip install -r preprocessing/requirements.txt

      - name: Jalankan preprocessing otomatis
        run: >
          python preprocessing/automate_BryanNoel.py
          --raw codecomplex_raw
          --out preprocessing/codecomplex_preprocessing

      - name: Unggah dataset hasil preprocessing sebagai artifact
        uses: actions/upload-artifact@v4
        with:
          name: codecomplex_preprocessing
          path: preprocessing/codecomplex_preprocessing/

      - name: Commit dataset terbaru ke repositori
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add preprocessing/codecomplex_preprocessing
          if git diff --cached --quiet; then
            echo "Tidak ada perubahan pada dataset."
          else
            git commit -m "chore: perbarui dataset hasil preprocessing [skip ci]"
            git push
          fi
